name: Build, Test, Scan & GitOps Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: storefront-api

jobs:
  build-test-scan-push:
    name: 1. Build, Smoke Test, Scan & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build container image (tagged with commit SHA)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest .

      - name: Smoke test hardened read-only container
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run -d --name smoke-test --read-only -p 8080:8080 -e APP_ENV=ci $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          sleep 3
          curl -f http://localhost:8080/health
          curl -f http://localhost:8080/
          docker rm -f smoke-test

      - name: Run Trivy vulnerability scan (generate SARIF report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security UI
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Fail build on HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Push verified image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

  update-gitops:
    name: 2. Bump Image Tag in GitOps Repo
    needs: build-test-scan-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps config repository
        uses: actions/checkout@v4
        with:
          repository: Bsalarian/storefront-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update test overlay image tag
        env:
          REGISTRY: 155312145338.dkr.ecr.eu-north-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd gitops/deploy/overlays/test
          kustomize edit set image $REGISTRY/storefront-api=$REGISTRY/storefront-api:$IMAGE_TAG
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git diff --staged --quiet || git commit -m "chore(test): bump storefront-api to ${IMAGE_TAG::7}"
          git push