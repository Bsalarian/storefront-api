name: Build, Test, Scan & GitOps Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: storefront-api

jobs:
  ci-pipeline:
    name: Build, Smoke Test, Trivy Scan & Update GitOps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build container image (tagged with commit SHA)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest .

      - name: Smoke test hardened read-only container
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run -d --name smoke-test --read-only -p 8080:8080 -e APP_ENV=ci $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          sleep 3
          curl -f http://localhost:8080/health
          curl -f http://localhost:8080/
          docker rm -f smoke-test

      - name: Run Trivy vulnerability scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Push verified image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

      - name: Checkout GitOps config repository
        uses: actions/checkout@v4
        with:
          repository: Bsalarian/storefront-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update test overlay image tag in GitOps repo
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd gitops/deploy/overlays/test
          kustomize edit set image $REGISTRY/$ECR_REPOSITORY=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git diff --staged --quiet || git commit -m "chore(test): bump storefront-api to ${IMAGE_TAG::7}"
          git push